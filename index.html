<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌀 Loading screen · pure CSS</title>
    <style>
        /* ----- global reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0c0e13;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        /* ----- loading card ----- */
        .loader-container {
            background: #171b24;
            padding: 3rem 4rem 4rem 4rem;
            border-radius: 3rem;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7),
                        inset 0 1px 2px rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.2rem;
            min-width: 280px;
        }

        /* ----- spinner ring (pure CSS) ----- */
        .spinner {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .spinner-ring {
            box-sizing: border-box;
            position: absolute;
            width: 100%;
            height: 100%;
            border: 6px solid transparent;
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            will-change: transform;
        }

        /* each ring with different colour & delay */
        .ring-1 {
            border-top-color: #f43f5e;      /* rose */
            animation-delay: 0s;
        }
        .ring-2 {
            border-right-color: #8b5cf6;     /* violet */
            animation-delay: 0.15s;
        }
        .ring-3 {
            border-bottom-color: #3b82f6;    /* blue */
            animation-delay: 0.3s;
        }
        .ring-4 {
            border-left-color: #22d3ee;       /* cyan */
            animation-delay: 0.45s;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ----- inner dot (pulse) ----- */
        .spinner-dot {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner-dot::after {
            content: '';
            width: 18px;
            height: 18px;
            background: #d1d5db;
            border-radius: 50%;
            box-shadow: 0 0 20px #a78bfa, 0 0 40px #6366f1;
            animation: pulse-dot 1.4s ease-in-out infinite alternate;
        }

        @keyframes pulse-dot {
            0%   { opacity: 0.35; transform: scale(0.7); background: #c7d2fe; }
            100% { opacity: 1; transform: scale(1.1); background: #e0e7ff; box-shadow: 0 0 30px #818cf8, 0 0 60px #4f46e5; }
        }

        /* ----- loading text + animated ellipsis ----- */
        .loading-text {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            color: #e2e8f0;
            font-weight: 450;
            font-size: 1.6rem;
            letter-spacing: 1px;
            background: rgba(255,255,255,0.02);
            padding: 0.2rem 1.6rem 0.2rem 1.6rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.03);
        }

        .loading-text span {
            display: inline-block;
            animation: ellipsis 1.6s steps(4, end) infinite;
            font-weight: 300;
            color: #94a3b8;
            min-width: 1.8rem;
            text-align: left;
        }

        @keyframes ellipsis {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        /* pseudo-element trick for animated dots */
        .loading-text span::after {
            content: '...';
            display: inline-block;
            width: 1.8rem;
            animation: ellipsis-dots 1.6s steps(4, end) infinite;
            color: #a5b4fc;
            letter-spacing: 2px;
        }

        @keyframes ellipsis-dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        /* small label / status */
        .status-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #64748b;
            background: #0e121b;
            padding: 0.4rem 1.4rem;
            border-radius: 30px;
            border: 1px solid #2d3748;
            margin-top: -0.2rem;
        }

        /* ----- optional progress bar (extra flair) ----- */
        .progress-track {
            width: 100%;
            max-width: 220px;
            height: 4px;
            background: #262e3b;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #f43f5e, #8b5cf6, #3b82f6, #22d3ee);
            background-size: 300% 100%;
            border-radius: 20px;
            animation: loading-progress 2.4s ease-in-out infinite alternate;
        }

        @keyframes loading-progress {
            0%   { width: 0%; background-position: 0% 0%; }
            30%  { width: 35%; background-position: 20% 0%; }
            70%  { width: 75%; background-position: 60% 0%; }
            100% { width: 100%; background-position: 100% 0%; }
        }

        /* small responsive tweaks */
        @media (max-width: 480px) {
            .loader-container {
                padding: 2.2rem 1.8rem 2.8rem 1.8rem;
                border-radius: 2rem;
                min-width: unset;
                width: 90%;
            }
            .loading-text {
                font-size: 1.3rem;
                padding: 0.2rem 1rem;
            }
            .spinner {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <!-- spinner with 4 rings + inner dot -->
        <div class="spinner">
            <div class="spinner-ring ring-1"></div>
            <div class="spinner-ring ring-2"></div>
            <div class="spinner-ring ring-3"></div>
            <div class="spinner-ring ring-4"></div>
            <div class="spinner-dot"></div>
        </div>

        <!-- text + animated ellipsis (pure CSS) -->
        <div class="loading-text">
            LOADING<span></span>
        </div>

        <!-- extra visual: progress bar -->
        <div class="progress-track">
            <div class="progress-bar"></div>
        </div>

        <!-- tiny status -->
        <div class="status-label">⚡ please wait</div>
    </div>
</body>
</html>
